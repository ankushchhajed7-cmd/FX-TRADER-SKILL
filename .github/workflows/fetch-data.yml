name: fetch-data

# Downloads fresh 5-minute candles (Yahoo) into data/5m/ and commits them.
# - Every weekday night after New York close (scheduled runs work on main only)
# - Manually: Actions tab > fetch-data > Run workflow (use it before scanning live)
# - Once on any push to a feature-* branch that changes the fetcher

on:
  schedule:
    - cron: "33 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: ["feature-*"]
    paths:
      - "tools/fetch_data.py"
      - "fx-core/fxcore.py"
      - ".github/workflows/fetch-data.yml"

permissions:
  contents: write

concurrency:
  group: fetch-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch candles
        run: python3 tools/fetch_data.py

      - name: Commit data
        run: |
          git config user.name "fx-data-bot"
          git config user.email "fx-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new candles."
          else
            git commit -m "data: candles $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
